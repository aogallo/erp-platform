# OpenSpec Configuration — enterprise-resource-planning
# Refreshed by sdd-init on 2026-06-08. Do not edit manually unless intentional.

schema: spec-driven
project: erp-platform
initialized_at: 2026-06-05
refreshed_at: 2026-06-08

context: |
  Modular ERP platform with FastAPI + PostgreSQL + SQLAlchemy + Flyway backend.
  Frontend: React + TypeScript + Vite with TanStack Query and Zod.
  Architecture: Hexagonal Architecture + DDD by bounded context, Repository Pattern, Service Layer, Unit of Work.
  Bounded contexts: IAM, CRM, Sales, Inventory, Purchasing, Accounting, Banking, HR.
  Current repo has backend/frontend scaffold code but no dependency manifests or test runner configs yet.
  Strict TDD is the project policy; PR4 is expected to add tests, CI, Flyway, and tooling scaffolding.

strict_tdd: true
persistence_mode: openspec

activation:
  sdd_active: true
  artifact_store: openspec
  execution_mode: interactive
  chained_pr_strategy: ask-always
  review_budget_lines: 400
  current_phase: init-refresh
  next_change: PR4 tests/CI/Flyway

testing:
  runner: uv run pytest
  runner_framework: pytest
  layers:
    unit:
      available: planned
      tool: pytest
    integration:
      available: planned
      tool: pytest-asyncio + PostgreSQL test database
    e2e:
      available: false
      tool: null
  coverage:
    available: planned
    command: uv run pytest --cov=src
  quality:
    linter:
      available: planned
      command: uv run ruff check .
    type_checker:
      available: planned
      command: uv run pyright
    formatter:
      available: planned
      command: uv run ruff format .

phases:
  proposal:
    required: true
    path: openspec/changes/{change_id}/proposal.md
  spec:
    required: true
    path: openspec/changes/{change_id}/specs/{domain}/spec.md
  design:
    required: true
    path: openspec/changes/{change_id}/design.md
  tasks:
    required: true
    path: openspec/changes/{change_id}/tasks.md
  apply:
    required: true
    path: openspec/changes/{change_id}/tasks.md
    tdd: true
    test_command: uv run pytest
    include:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.sql"
      - "**/*.yaml"
  verify:
    required: true
    path: openspec/changes/{change_id}/verify-report.md
    test_command: uv run pytest
    build_command: ""
    coverage_threshold: 0
  archive:
    required: true
    path: openspec/changes/archive/
