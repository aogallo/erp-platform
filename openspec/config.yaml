# OpenSpec Configuration — enterprise-resource-planning
# Auto-generated by sdd-init. Do not edit manually unless intentional.

context: |
  ERP system with FastAPI + PostgreSQL + SQLAlchemy + Flyway backend.
  Clean/Hexagonal Architecture with DDD, Repository Pattern, Service Layer.
  Frontend: React + TypeScript + Vite.
  Bounded contexts: IAM, CRM, Sales, Inventory, Purchasing, Accounting, Banking, HR.
  Greenfield project — no production code yet.
  Strict TDD is the project policy; test runners are planned during scaffolding.

strict_tdd: true
persistence_mode: openspec

testing:
  runner: uv run pytest
  runner_framework: pytest
  layers:
    unit:
      available: planned
      tool: pytest
    integration:
      available: planned
      tool: pytest-asyncio + PostgreSQL test database
    e2e:
      available: false
      tool: null
  coverage:
    available: planned
    command: uv run pytest --cov=src
  quality:
    linter:
      available: planned
      command: uv run ruff check .
    type_checker:
      available: planned
      command: uv run pyright
    formatter:
      available: planned
      command: uv run ruff format .

phases:
  proposal:
    required: true
    path: openspec/changes/{change_id}/proposal.md
  spec:
    required: true
    path: openspec/changes/{change_id}/spec.md
  design:
    required: true
    path: openspec/changes/{change_id}/design.md
  tasks:
    required: true
    path: openspec/changes/{change_id}/tasks.md
  apply:
    required: true
    path: openspec/changes/{change_id}/apply/
    include:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.sql"
      - "**/*.yaml"
  verify:
    required: true
    path: openspec/changes/{change_id}/verify.md
  archive:
    required: true
    path: openspec/changes/archive/
