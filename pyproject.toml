[project]
name = "erp-platform-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for the ERP platform."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pyright]
include = ["backend/src", "backend/tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["backend/src"]
reportReturnType = false
